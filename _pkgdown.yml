url: https://graemeleehickey.github.io/goldilocks/

template:
  bootstrap: 5
  light-switch: true
  theme: github-light
  theme-dark: github-dark
  math-rendering: katex
  includes:
    after_body: |
      <script>
      // pkgdown uses plain text for both the article heading and its index entry.
      const calibrationTitle = document.querySelector('.template-article-index a[href="calibrating-prob-ha.html"], .template-article h1');
      if (calibrationTitle?.textContent.includes('prob_ha')) {
        calibrationTitle.innerHTML = calibrationTitle.innerHTML.replace(/\bprob_ha\b/, '<code>prob_ha</code>');
      }
      </script>

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fa-github
      href: https://github.com/graemeleehickey/goldilocks
      aria-label: GitHub repository

reference:
  - title: Package
    contents:
      - goldilocks

  - title: Adaptive trial simulation
    desc: >
      Core functions for simulating and summarizing Goldilocks adaptive
      trial designs.
    contents:
      - survival_adapt
      - evaluate_interim
      - sim_trials
      - sim_trial_paths
      - apply_stopping_rules
      - print.goldilocks_paths
      - sim_horizon_trials
      - sim_horizon_paths
      - apply_horizon_rules
      - print.goldilocks_horizon_paths
      - summarise_sims
      - summarise_calendar_time
      - plot_enrollment
      - plot_sim_ocs
      - plot_sim_decisions
      - summarise_trial_trace
      - plot_trial_trace
      - plot_sim_stopping
      - print.goldilocks_interim
      - print.goldilocks_trial
      - print.goldilocks_calendar_summary

  - title: Trial data generation
    desc: >
      Simulate complete trial datasets, including enrollment, randomization,
      and time-to-event outcomes.
    contents:
      - sim_comp_data
      - enrollment
      - randomization

  - title: Piecewise exponential utilities
    desc: >
      Functions for simulating, imputing, and computing distributions under
      the piecewise exponential model.
    contents:
      - pwe_sim
      - pwe_impute
      - ppwe
      - prob_to_haz

articles:
  - title: Getting started
    contents:
      - two-arm
      - bayes-piecewise
      - rmst
      - bayesian-binary
      - frequentist-binary
      - single-arm
      - interim-data
  - title: Calibration and interrogation
    contents:
      - calibrating-prob-ha
      - calibrating-stopping-rules
      - endpoint-horizons-example
      - decision-traces
  - title: Real trial examples
    contents:
      - advent
      - anthem-hfref
      - thermocool-af
      - promise-ii
  - title: Statistical methods and reproducibility
    contents:
      - architecture
      - technical-methods
      - endpoint-horizons-technical
